<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英语阅读助手</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            min-width: 200px;
            font-family: system-ui, sans-serif;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        #status {
            margin-top: 8px;
            min-height: 1.2em;
            color: #333;
        }
    </style>
</head>

<body>
    <button type="button" id="exportBtn">导出数据</button>
    <button type="button" id="importBtn">导入数据</button>
    <input type="file" id="importFileInput" accept=".json,application/json" hidden>
    <p id="status" aria-live="polite"></p>
    <script type="module" src="popup.js"></script>
</body>

</html>
